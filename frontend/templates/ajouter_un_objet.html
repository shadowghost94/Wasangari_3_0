{% extends 'dashboard-base.html' %} {% block conteneur%}
<form
    method="POST"
    enctype="multipart/form-data"
    class="container-fluid bg-light p-4 rounded shadow"
>
    {% csrf_token %}
    <h4 class="mb-4">Ajouter un objet à vendre</h4>

    <div class="row g-3">
        <!-- Titre -->
        <div class="col-md-6">
            <label for="titre" class="form-label">Titre</label>
            <input
                type="text"
                class="form-control"
                id="titre"
                name="titre"
                required
            />
        </div>

        <!-- Auteur -->
        <div class="col-md-6">
            <label for="auteur" class="form-label">Auteur</label>
            <input
                type="text"
                class="form-control"
                id="auteur"
                name="auteur"
                required
            />
        </div>

        <!-- Prix -->
        <div class="col-md-6">
            <label for="prix" class="form-label">Prix (€)</label>
            <input
                type="number"
                step="0.01"
                class="form-control"
                id="prix"
                name="prix"
                required
            />
        </div>

        <!-- Image -->
        <div class="col-md-6">
            <label for="media_url" class="form-label">Image de l'objet</label>
            <input
                type="file"
                class="form-control"
                id="media_url"
                name="media_url"
                accept="image/*"
            />
        </div>

        <!-- Description -->
        <div class="col-12">
            <label for="description" class="form-label">Description</label>
            <textarea
                class="form-control"
                id="description"
                name="description"
                rows="3"
                maxlength="255"
                required
            ></textarea>
        </div>

        <!-- Bouton -->
        <div class="col-12 text-end mt-3">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
    </div>
</form>
{% endblock %}

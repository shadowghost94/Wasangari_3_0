{%load static%}
<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Dashboard Wasangari</title>
        <link rel="shortcut icon" type="image/png" />
        <link rel="stylesheet" href="{% static 'assets/css/dashboard.css' %}" />
    </head>

    <body>
        <!--  Body Wrapper -->
        <div
            class="page-wrapper"
            id="main-wrapper"
            data-layout="vertical"
            data-navbarbg="skin6"
            data-sidebartype="full"
            data-sidebar-position="fixed"
            data-header-position="fixed"
        >
            <aside class="left-sidebar">
                <!-- Sidebar scroll-->
                <div>
                    <div
                        class="brand-logo d-flex align-items-center justify-content-between"
                    >
                        <a href="./dashboard.html" class="text-nowrap logo-img">
                            <h1>Wasangari</h1>
                        </a>
                        <div
                            class="close-btn d-xl-none d-block sidebartoggler cursor-pointer"
                            id="sidebarCollapse"
                        >
                            <i class="ti ti-x fs-6"></i>
                        </div>
                    </div>
                    <!-- Sidebar navigation-->
                    <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
                        <ul id="sidebarnav">
                            <li class="sidebar-item">
                                <a
                                    class="sidebar-link"
                                    href="{% url 'dashboard'%}"
                                    aria-expanded="false"
                                >
                                    <i class="ti ti-atom"></i>
                                    <span class="hide-menu">DASHBOARD</span>
                                </a>
                            </li>
                            <!-- a----------------------------------a -->
                            <!-- Dashboard -->
                            <!-- a----------------------------------a -->
                            <li class="sidebar-item">
                                <a
                                    class="sidebar-link justify-content-between"
                                    href="{% url 'ajouter_cours'%}"
                                    aria-expanded="false"
                                >
                                    <div
                                        class="d-flex align-items-center gap-3"
                                    >
                                        <span class="d-flex">
                                            <i class="ti ti-book"></i>
                                        </span>
                                        <span class="hide-menu"
                                            >AJOUTER UN COURS</span
                                        >
                                    </div>
                                </a>
                            </li>
                            <li class="sidebar-item">
                                <a
                                    class="sidebar-link justify-content-between"
                                    href="{% url 'ajouter_objet' %}"
                                    aria-expanded="false"
                                >
                                    <div
                                        class="d-flex align-items-center gap-3"
                                    >
                                        <span class="d-flex">
                                            <i class="ti ti-package"></i>
                                        </span>
                                        <span class="hide-menu"
                                            >AJOUTER UN OBJET</span
                                        >
                                    </div>
                                </a>
                            </li>
                            <li class="sidebar-item">
                                <a
                                    class="sidebar-link justify-content-between"
                                    href="{% url 'ajouter_evenement' %}"
                                    aria-expanded="false"
                                >
                                    <div
                                        class="d-flex align-items-center gap-3"
                                    >
                                        <span class="d-flex">
                                            <i class="ti ti-calendar"></i>
                                        </span>
                                        <span class="hide-menu"
                                            >AJOUTER EVENEMENT</span
                                        >
                                    </div>
                                </a>
                            </li>
                            <li>
                                <span class="sidebar-divider lg"></span>
                            </li>

                            <li class="sidebar-item">
                                <a
                                    class="sidebar-link justify-content-between"
                                    href="{% url 'ajouter_image' %}"
                                    aria-expanded="false"
                                >
                                    <div
                                        class="d-flex align-items-center gap-3"
                                    >
                                        <span class="d-flex">
                                            <i class="ti ti-upload"></i>
                                        </span>
                                        <span class="hide-menu"
                                            >AJOUTER UNE IMAGE</span
                                        >
                                    </div>
                                </a>
                            </li>
                        </ul>
                    </nav>
                    <!-- End Sidebar navigation -->
                </div>
                <!-- End Sidebar scroll-->
            </aside>
            <!--  Sidebar End -->
            <!--  Main wrapper -->
            <div class="body-wrapper">
                <!--  Header Start -->
                <header class="app-header">
                    <nav class="navbar navbar-expand-lg navbar-light">
                        <ul class="navbar-nav">
                            <li class="nav-item d-block d-xl-none">
                                <a
                                    class="nav-link sidebartoggler"
                                    id="headerCollapse"
                                    href="javascript:void(0)"
                                >
                                    <i class="ti ti-menu-2"></i>
                                </a>
                            </li>
                            <li class="nav-item dropdown">
                                <a
                                    class="nav-link"
                                    href="javascript:void(0)"
                                    id="drop1"
                                    data-bs-toggle="dropdown"
                                    aria-expanded="false"
                                >
                                    <i class="ti ti-bell"></i>
                                    <div
                                        class="notification bg-primary rounded-circle"
                                    ></div>
                                </a>
                                <div
                                    class="dropdown-menu dropdown-menu-animate-up"
                                    aria-labelledby="drop1"
                                >
                                    <div class="message-body">
                                        <a
                                            href="javascript:void(0)"
                                            class="dropdown-item"
                                        >
                                            Item 1
                                        </a>
                                        <a
                                            href="javascript:void(0)"
                                            class="dropdown-item"
                                        >
                                            Item 2
                                        </a>
                                    </div>
                                </div>
                            </li>
                        </ul>
                        <div
                            class="navbar-collapse justify-content-end px-0"
                            id="navbarNav"
                        >
                            <ul
                                class="navbar-nav flex-row ms-auto align-items-center justify-content-end"
                            >
                                <li class="nav-item dropdown">
                                    <a
                                        class="nav-link"
                                        href="javascript:void(0)"
                                        id="drop2"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false"
                                    >
                                        <img
                                            src="https://wasangari-bucket.s3.eu-north-1.amazonaws.com/{{user.photo_de_profil}}"
                                            alt=""
                                            width="35"
                                            height="35"
                                            class="rounded-circle"
                                        />
                                    </a>
                                    <div
                                        class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up"
                                        aria-labelledby="drop2"
                                    >
                                        <div class="message-body">
                                            <a
                                                href="javascript:void(0)"
                                                class="d-flex align-items-center gap-2 dropdown-item"
                                            >
                                                <i class="ti ti-user fs-6"></i>
                                                <p class="mb-0 fs-3">
                                                    My Profile
                                                </p>
                                            </a>
                                            <a
                                                href="javascript:void(0)"
                                                class="d-flex align-items-center gap-2 dropdown-item"
                                            >
                                                <i class="ti ti-mail fs-6"></i>
                                                <p class="mb-0 fs-3">
                                                    My Account
                                                </p>
                                            </a>
                                            <a
                                                href="javascript:void(0)"
                                                class="d-flex align-items-center gap-2 dropdown-item"
                                            >
                                                <i
                                                    class="ti ti-list-check fs-6"
                                                ></i>
                                                <p class="mb-0 fs-3">My Task</p>
                                            </a>
                                            <a
                                                href="./authentication-login.html"
                                                class="btn btn-outline-primary mx-3 mt-2 d-block"
                                                >Logout</a
                                            >
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </nav>
                </header>
                <!--  Header End -->
                {%block conteneur%}{%endblock%}
            </div>
        </div>
        <script src="{% static 'assets/libs/jquery/dist/jquery.min.js' %}"></script>
        <script src="{% static 'assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>
        <script src="{% static 'assets/js/sidebarmenu.js' %}"></script>
        <script src="{% static 'assets/js/app.min.js' %}"></script>
        <script src="{% static 'assets/libs/apexcharts/dist/apexcharts.min.js' %}"></script>
        <script src="{% static 'assets/libs/simplebar/dist/simplebar.js' %}"></script>
        <script src="{% static 'assets/js/dashboard.js' %}"></script>
        <!-- solar icons -->
        <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
    </body>
</html>

{% extends 'dashboard-base.html' %} {% block conteneur%}
<form
    method="POST"
    enctype="multipart/form-data"
    class="container-fluid bg-light p-4 rounded shadow mt-4"
>
    {% csrf_token %}
    <h4 class="mb-4">Créer un nouvel évènement</h4>

    <div class="row g-3">
        <!-- Nom -->
        <div class="col-md-6">
            <label for="nom" class="form-label">Nom de l'évènement</label>
            <input
                type="text"
                class="form-control"
                id="nom"
                name="nom"
                required
            />
        </div>

        <!-- Lieu -->
        <div class="col-md-6">
            <label for="lieu" class="form-label">Lieu</label>
            <input
                type="text"
                class="form-control"
                id="lieu"
                name="lieu"
                required
            />
        </div>

        <!-- Date -->
        <div class="col-md-6">
            <label for="date" class="form-label">Date</label>
            <input
                type="date"
                class="form-control"
                id="date"
                name="date"
                required
            />
        </div>

        <!-- Statut -->
        <div class="col-md-6">
            <label for="statut" class="form-label">Statut</label>
            <input
                type="text"
                class="form-control"
                id="statut"
                name="statut"
                placeholder="Ouvert, En attente, Annulé..."
                required
            />
        </div>

        <!-- Prix d'entrée -->
        <div class="col-md-6">
            <label for="prix_entree" class="form-label"
                >Prix d'entrée (€)</label
            >
            <input
                type="number"
                step="0.01"
                class="form-control"
                id="prix_entree"
                name="prix_entree"
                required
            />
        </div>

        <!-- Nombre de places disponibles -->
        <div class="col-md-6">
            <label for="nbr_places_dispo" class="form-label"
                >Places disponibles</label
            >
            <input
                type="number"
                class="form-control"
                id="nbr_places_dispo"
                name="nbr_places_dispo"
                required
            />
        </div>

        <!-- Image -->
        <div class="col-md-6">
            <label for="media_profil_url" class="form-label"
                >Image de l'évènement</label
            >
            <input
                type="file"
                class="form-control"
                id="media_profil_url"
                name="media_profil_url"
                accept="image/*"
            />
        </div>

        <!-- Description -->
        <div class="col-12">
            <label for="description" class="form-label">Description</label>
            <textarea
                class="form-control"
                id="description"
                name="description"
                rows="4"
                required
            ></textarea>
        </div>

        <!-- Bouton -->
        <div class="col-12 text-end">
            <button type="submit" class="btn btn-success mt-3">
                Créer l'évènement
            </button>
        </div>
    </div>
</form>
{%endblock%}
